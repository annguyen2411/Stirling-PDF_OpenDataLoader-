    <!-- Tự động ghim các công cụ thiết yếu và cài đặt tiếng Việt -->
    <script>
      (function () {
        try {
          // 1. Tự động ghim 6 công cụ thiết yếu cho nhân viên (Gộp, Tách, Nén, Chuyển đổi, Ký, OCR)
          var favs = localStorage.getItem("stirlingpdf.favoriteTools");
          if (!favs || favs === "[]" || favs === "null") {
            localStorage.setItem(
              "stirlingpdf.favoriteTools",
              JSON.stringify(["merge", "split", "compress", "convert", "sign", "ocr"])
            );
          }

          // 2. Tự động đặt ngôn ngữ mặc định là Tiếng Việt nếu chưa có
          var p = JSON.parse(
            localStorage.getItem("stirlingpdf_preferences") || "{}",
          );
          if (!p.language) {
            p.language = "vi_VN";
            localStorage.setItem("stirlingpdf_preferences", JSON.stringify(p));
          }

          // 3. Khóa cố định tiêu đề tab trình duyệt
          var fixedTitle = "Stirling - Trình xử lý mọi tác vụ PDF";
          document.title = fixedTitle;
          setInterval(function () {
            if (document.title !== fixedTitle) {
              document.title = fixedTitle;
            }
          }, 300);

          var mode = p.theme || "system";
          var scheme =
            mode === "light"
              ? "light"
              : mode === "dark"
                ? "dark"
                : window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light";
          var r = document.documentElement;
          r.setAttribute("data-theme", scheme);
          r.setAttribute("data-app-theme", "custom");
          r.setAttribute("data-accent", "default");
          r.setAttribute("data-mantine-color-scheme", scheme);
        } catch (e) {
          /* fallback */
        }
      })();
    </script>

    <div id="root"></div>

    <script>
      (function() {
        function injectSubtitle() {
          // 1. Mobile brand text
          var mobileBrand = document.querySelector('.mobile-brand');
          if (mobileBrand && !document.getElementById('stirling-sub-mobile')) {
            var sub = document.createElement('span');
            sub.id = 'stirling-sub-mobile';
            sub.textContent = '— Trình xử lý mọi tác vụ PDF';
            sub.style.cssText = 'font-size: 11.5px; font-weight: 500; color: var(--c-text-muted, #6B7280); margin-left: 8px; white-space: nowrap;';
            mobileBrand.appendChild(sub);
          }

          // 2. Desktop Quick Nav button tooltip
          var quickNavBtn = document.querySelector('.quick-nav-brand-button');
          if (quickNavBtn && !quickNavBtn.getAttribute('data-sub-bound')) {
            quickNavBtn.setAttribute('data-sub-bound', 'true');
            quickNavBtn.setAttribute('title', 'Stirling - Trình xử lý mọi tác vụ PDF');
          }

          // 3. Desktop top-bar beside search
          var searchInput = document.querySelector('input[type="search"], input[placeholder*="Tìm"], input[placeholder*="Search"]');
          if (searchInput) {
            var searchBox = searchInput.closest('div');
            var topBar = searchBox ? searchBox.parentElement : null;
            if (topBar) {
              var host = window.location.hostname;
              var isTechhave = host.indexOf('techhave.com') !== -1;
              var odUrl = isTechhave 
                ? window.location.protocol + '//ai-pdf.techhave.com' 
                : window.location.protocol + '//' + host + ':9281';

              var existing = document.getElementById('stirling-sub-desktop');
              if (existing) {
                var btn = existing.querySelector('a');
                if (btn && btn.href !== odUrl) {
                  btn.href = odUrl;
                }
              } else {
                var textNode = document.createElement('div');
                textNode.id = 'stirling-sub-desktop';
                textNode.innerHTML = '<span style="font-size: 12.5px; font-weight: 600; color: var(--c-text-muted, #71717A); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;"><strong style="font-weight: 800; color: var(--c-text-primary, inherit);">Stirling PDF</strong> <span style="opacity: 0.4;">|</span> <span>Trình xử lý mọi tác vụ PDF</span></span><a id="btn-opendataloader" href="' + odUrl + '" onclick="var h=window.location.hostname; window.location.href=(h.indexOf(\'techhave.com\')!==-1?window.location.protocol+\'//ai-pdf.techhave.com\':window.location.protocol+\'//\'+h+\':9281\'); return false;" style="margin-left: 12px; background: #EF4444; color: white; text-decoration: none; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 2px 6px rgba(239, 68, 68, 0.3); transition: transform 0.2s; cursor: pointer;" onmouseover="this.style.transform=\'scale(1.05)\'" onmouseout="this.style.transform=\'scale(1)\'">⚡ Bóc tách AI (OpenDataLoader)</a>';
                textNode.style.cssText = 'display: inline-flex; align-items: center; margin-right: 18px; user-select: none;';
                topBar.insertBefore(textNode, searchBox);
              }
            }
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            injectSubtitle();
            new MutationObserver(injectSubtitle).observe(document.body, { childList: true, subtree: true });
          });
        } else {
          injectSubtitle();
          new MutationObserver(injectSubtitle).observe(document.body, { childList: true, subtree: true });
        }
      })();
    </script>
